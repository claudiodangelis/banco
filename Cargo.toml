[package]
name = "banco"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "banco"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
ctrlc = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
regex = "1.12.3"
chrono = "0.4"
